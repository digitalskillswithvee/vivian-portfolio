backend:
  name: github
  repo: digitalskillswithvee/vivian-portfolio
  branch: main

media_folder: /assets/uploads
public_folder: /assets/uploads

collections:
  - name: portfolio
    label: Portfolio Content
    files:
      - name: main
        label: Website Content
        file: content/portfolio.json
        format: json
        fields:
          - name: portrait
            label: Main Profile Photo
            widget: image
            hint: This is the large portrait in the homepage introduction.
          - name: about_portrait
            label: About Section Photo
            widget: image
            hint: This is the second photo in the About section.
          - name: projects
            label: Projects and Case Studies
            label_singular: Project
            widget: list
            fields:
              - { name: id, label: Internal ID, widget: string, hint: Keep this short and unique, e.g. new-client-project }
              - { name: category, label: Project Category, widget: select, options: [{label: Social Media, value: social}, {label: Customer Experience, value: experience}, {label: Creative and UGC, value: creative}, {label: Concept Project, value: concept}] }
              - { name: kicker, label: Small Category Label, widget: string }
              - { name: title, label: Project Title, widget: string }
              - { name: client, label: Client or Project Type, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: image, label: Project Cover Image, widget: image, required: false }
              - { name: image_alt, label: Image Description, widget: string, required: false }
              - { name: video, label: Project Video (Optional), widget: file, required: false }
              - { name: video_caption, label: Video Caption (Optional), widget: string, required: false }
              - { name: summary, label: Short Introduction, widget: text }
              - name: sections
                label: Case Study Sections
                label_singular: Section
                widget: list
                fields:
                  - { name: heading, label: Section Heading, widget: string }
                  - { name: body, label: Section Text, widget: text }
              - { name: note, label: Closing Note, widget: text, required: false }
          - name: testimonials
            label: Testimonials
            label_singular: Testimonial
            widget: list
            fields:
              - { name: quote, label: Testimonial, widget: text }
              - { name: name, label: Person's Name, widget: string }
              - { name: role, label: Role and Organisation, widget: string }
              - { name: featured, label: Highlight This Testimonial, widget: boolean, default: false }
