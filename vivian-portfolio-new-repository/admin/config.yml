backend:
  name: github
  repo: digitalskillswithvee/vivian-portfolio
  branch: main
  root_dir: vivian-portfolio-new-repository

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: portfolio
    label: Portfolio Content
    files:
      - name: main
        label: Website Content
        file: content/portfolio.json
        format: json
        fields:
          - name: site_copy
            label: Website Text
            widget: object
            fields:
              - { name: hero_intro, label: Hero Introduction, widget: text, required: false }
              - { name: intro_statement, label: Intro Statement, widget: text, required: false }
              - { name: approach_intro, label: My Approach Introduction, widget: text, required: false }
              - { name: about_lead, label: About Lead, widget: text, required: false }
              - { name: about_paragraph_1, label: About Paragraph One, widget: text, required: false }
              - { name: about_paragraph_2, label: About Paragraph Two, widget: text, required: false }
              - { name: zero_to_smm_intro, label: Zero to SMM Introduction, widget: text, required: false }
              - { name: contact_intro, label: Contact Introduction, widget: text, required: false }
              - { name: announcement_text, label: announcement text, widget: text, required: false }
              - { name: announcement_location, label: announcement location, widget: text, required: false }
              - { name: hero_eyebrow, label: hero eyebrow, widget: text, required: false }
              - { name: intro_eyebrow, label: intro eyebrow, widget: text, required: false }
              - { name: work_intro, label: work intro, widget: text, required: false }
              - { name: step_1_title, label: step 1 title, widget: text, required: false }
              - { name: step_1_body, label: step 1 body, widget: text, required: false }
              - { name: step_2_title, label: step 2 title, widget: text, required: false }
              - { name: step_2_body, label: step 2 body, widget: text, required: false }
              - { name: step_3_title, label: step 3 title, widget: text, required: false }
              - { name: step_3_body, label: step 3 body, widget: text, required: false }
              - { name: step_4_title, label: step 4 title, widget: text, required: false }
              - { name: step_4_body, label: step 4 body, widget: text, required: false }
              - { name: testimonials_intro, label: testimonials intro, widget: text, required: false }
              - { name: timezone_intro, label: timezone intro, widget: text, required: false }
              - { name: zero_to_smm_extra, label: zero to smm extra, widget: text, required: false }
              - { name: capabilities_intro, label: capabilities intro, widget: text, required: false }

          - name: portrait
            label: Main Profile Photo
            widget: image
            required: false

          - name: about_portrait
            label: About Section Photo
            widget: image
            required: false

          - name: projects
            label: Projects and Case Studies
            label_singular: Project
            widget: list
            required: false
            fields:
              - { name: id, label: Internal ID, widget: string, required: false }
              - name: category
                label: Project Category
                widget: select
                required: false
                options:
                  - { label: Social Media, value: social }
                  - { label: Customer Experience, value: experience }
                  - { label: Creative and UGC, value: creative }
                  - { label: Concept Project, value: concept }
              - { name: kicker, label: Small Category Label, widget: string, required: false }
              - { name: title, label: Project Title, widget: string, required: false }
              - { name: client, label: Client or Project Type, widget: string, required: false }
              - { name: year, label: Year, widget: string, required: false }
              - { name: image, label: Project Cover Image, widget: image, required: false }
              - { name: image_alt, label: Image Description, widget: string, required: false }
              - { name: video, label: Project Video Link, widget: string, required: false, hint: Paste a public video URL from YouTube, Vimeo, TikTok, Instagram, Facebook, or a direct MP4 link. }
              - { name: video_thumbnail, label: Video Cover Image, widget: image, required: false, hint: Upload a thumbnail image visitors will see before opening or playing the video. }
              - { name: video_caption, label: Video Caption, widget: string, required: false }
              - { name: strategy_document, label: Strategy Document (PDF), widget: file, required: false, media_folder: assets/uploads, public_folder: /assets/uploads, hint: Upload a PDF strategy or campaign document for visitors to view. }
              - { name: presentation_link, label: Presentation Link, widget: string, required: false, hint: Paste a viewer-accessible link to a Google Slides or online presentation. }
              - { name: summary, label: Short Introduction, widget: text, required: false }
              - name: sections
                label: Case Study Sections
                label_singular: Section
                widget: list
                required: false
                fields:
                  - { name: heading, label: Section Heading, widget: string, required: false }
                  - { name: body, label: Section Text, widget: text, required: false }
              - { name: note, label: Closing Note, widget: text, required: false }

          - name: testimonials
            label: Testimonials
            label_singular: Testimonial
            widget: list
            required: false
            fields:
              - { name: quote, label: Testimonial, widget: text, required: false }
              - { name: name, label: Person's Name, widget: string, required: false }
              - { name: role, label: Role and Organisation, widget: string, required: false }
              - { name: featured, label: Highlight This Testimonial, widget: boolean, required: false, default: false }
